http.enabled = true
http.host = 0.0.0.0
http.port = 8182
https.enabled = false

# Public address used in info.json (tile URLs), otherwise it contains the internal host name.
base_uri = http://localhost:8080

endpoint.iiif.1.enabled = false
endpoint.iiif.2.enabled = false
endpoint.iiif.3.enabled = true
endpoint.admin.enabled = false
endpoint.api.enabled = false

source.static = S3Source
source.delegate = false

S3Source.endpoint = http://minio:9000
S3Source.region = local
S3Source.access_key_id = neboltai
S3Source.secret_key = neboltai-secret
S3Source.lookup_strategy = BasicLookupStrategy
S3Source.BasicLookupStrategy.bucket.name = collection-masters
S3Source.BasicLookupStrategy.path_prefix =
S3Source.BasicLookupStrategy.path_suffix =
S3Source.chunking.enabled = true

# Development cache. Production may use a larger filesystem or S3 cache.
cache.server.derivative.enabled = true
cache.server.derivative = FilesystemCache
FilesystemCache.pathname = /tmp/cantaloupe-cache
cache.server.info.enabled = true

log.application.level = info
log.application.ConsoleAppender.enabled = true
log.error.ConsoleAppender.enabled = true
