server:
  port: 8081

spring:
  application:
    name: artwork-service
  servlet:
    multipart:
      max-file-size: ${IMAGE_UPLOAD_MAX_FILE_SIZE:2GB}
      max-request-size: ${IMAGE_UPLOAD_MAX_REQUEST_SIZE:2049MB}
      file-size-threshold: 0B
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalogdb}
    username: ${POSTGRES_USER:neboltai}
    password: ${POSTGRES_PASSWORD:neboltai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  image-conversion:
    vips-executable: ${VIPS_EXECUTABLE:vips}
    timeout: ${IMAGE_CONVERSION_TIMEOUT:PT10M}
  public-base-url: ${PUBLIC_BASE_URL:http://192.168.8.104:8080}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:neboltai}
    secret-key: ${MINIO_SECRET_KEY:neboltai-secret}
    master-bucket: ${MINIO_MASTER_BUCKET:collection-masters}
    preview-bucket: ${MINIO_PREVIEW_BUCKET:collection-previews}

management:
  endpoints:
    web:
      exposure:
        include: health,info
