services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neboltai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neboltai}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neboltai} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.31.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-neboltai}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-neboltai}
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    volumes:
      - ./infrastructure/liquibase/changelog:/liquibase/changelog:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /liquibase/liquibase --url=jdbc:postgresql://postgres:5432/postgres
        --changelog-file=server/db.changelog-root.yaml update &&
        /liquibase/liquibase --url=jdbc:postgresql://postgres:5432/catalogdb
        --changelog-file=catalog/db.changelog-root.yaml update
    networks: [backend]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neboltai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neboltai-secret}
    volumes:
      - minio-data:/data
    networks: [storage]
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    build: ./infrastructure/minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neboltai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neboltai-secret}
    volumes:
      - ./infrastructure/minio-init/images:/images:ro
      - ./infrastructure/minio-init/upload.sh:/upload.sh:ro
    entrypoint: ["/bin/sh", "/upload.sh"]
    networks: [storage]

  cantaloupe:
    image: islandora/cantaloupe:6.4.2
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # Islandora generates /opt/cantaloupe/cantaloupe.properties from these variables.
    environment:
      CANTALOUPE_HEAP_MIN: "512m"
      CANTALOUPE_HEAP_MAX: "2G"
      CANTALOUPE_HTTP_ENABLED: "true"
      CANTALOUPE_HTTP_HOST: "0.0.0.0"
      CANTALOUPE_HTTP_PORT: "8182"
      CANTALOUPE_HTTPS_ENABLED: "false"
      CANTALOUPE_BASE_URI: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      CANTALOUPE_ENDPOINT_IIIF_1_ENABLED: "false"
      CANTALOUPE_ENDPOINT_IIIF_2_ENABLED: "false"
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      CANTALOUPE_ENDPOINT_ADMIN_ENABLED: "false"
      CANTALOUPE_ENDPOINT_API_ENABLED: "false"
      CANTALOUPE_SOURCE_STATIC: "S3Source"
      CANTALOUPE_SOURCE_DELEGATE: "false"
      CANTALOUPE_S3SOURCE_ENDPOINT: "http://minio:9000"
      CANTALOUPE_S3SOURCE_REGION: "local"
      CANTALOUPE_S3SOURCE_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-neboltai}"
      CANTALOUPE_S3SOURCE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-neboltai-secret}"
      CANTALOUPE_S3SOURCE_LOOKUP_STRATEGY: "BasicLookupStrategy"
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME: "collection-masters"
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: ""
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_SUFFIX: ""
      CANTALOUPE_S3SOURCE_CHUNKING_ENABLED: "true"
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED: "true"
      CANTALOUPE_CACHE_SERVER_DERIVATIVE: "FilesystemCache"
      CANTALOUPE_FILESYSTEMCACHE_PATHNAME: "/data/cache"
      CANTALOUPE_CACHE_SERVER_INFO_ENABLED: "true"
      CANTALOUPE_LOG_APPLICATION_LEVEL: "info"
      CANTALOUPE_LOG_APPLICATION_CONSOLEAPPENDER_ENABLED: "true"
      CANTALOUPE_LOG_ERROR_CONSOLEAPPENDER_ENABLED: "true"
    networks: [backend, storage]
    # IMPORTANT: no host port. Cantaloupe is private.

  artwork-service:
    build:
      context: .
      dockerfile: artwork-service/Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalogdb
      POSTGRES_USER: ${POSTGRES_USER:-neboltai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neboltai}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-neboltai}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-neboltai-secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://192.168.8.104:8080}
    networks: [backend, storage]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - artwork-service
      - cantaloupe
    environment:
      ARTWORK_SERVICE_URL: http://artwork-service:8081
      CANTALOUPE_URL: http://cantaloupe:8182
    ports:
      - "8080:8080"
    networks: [backend]

networks:
  backend:
  storage:
    internal: true

volumes:
  postgres-data:
  minio-data:
