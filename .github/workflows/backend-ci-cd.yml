name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-gateway/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/michaelzaleskovsky/neboltai-api-gateway:latest
            ghcr.io/michaelzaleskovsky/neboltai-api-gateway:${{ github.sha }}

      - name: Build and push artwork-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artwork-service/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/michaelzaleskovsky/neboltai-artwork-service:latest
            ghcr.io/michaelzaleskovsky/neboltai-artwork-service:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519             "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"             "set -e
             cd /opt/neboltai
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             docker compose -f docker-compose.prod.yml pull
             docker compose -f docker-compose.prod.yml up -d --build
             docker image prune -f"
