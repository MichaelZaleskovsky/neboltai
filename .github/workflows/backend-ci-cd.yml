name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push api-gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-gateway/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/michaelzaleskovsky/neboltai-api-gateway:latest
            ghcr.io/michaelzaleskovsky/neboltai-api-gateway:${{ github.sha }}

      - name: Build and push artwork-service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: artwork-service/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/michaelzaleskovsky/neboltai-artwork-service:latest
            ghcr.io/michaelzaleskovsky/neboltai-artwork-service:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "set -e
             cd /opt/neboltai

             git fetch origin main
             git checkout main
             git reset --hard origin/main

             # Run backward-compatible database migrations
             docker compose -f docker-compose.prod.yml run --rm liquibase

             # Detect currently active backend slot from Nginx
             if grep -q '127.0.0.1:8082' /etc/nginx/conf.d/neboltai-backend.conf; then
               ACTIVE=green
               ACTIVE_PORT=8082
               INACTIVE=blue
               INACTIVE_PORT=8081
             else
               ACTIVE=blue
               ACTIVE_PORT=8081
               INACTIVE=green
               INACTIVE_PORT=8082
             fi

             echo \"Active slot: \$ACTIVE\"
             echo \"Deploying slot: \$INACTIVE\"

             # Pull new images for inactive slot
             docker compose -f docker-compose.blue-green.yml pull \
               artwork-service-\$INACTIVE \
               api-gateway-\$INACTIVE

             # Start/recreate inactive slot
             docker compose -f docker-compose.blue-green.yml up -d \
               --no-deps \
               --force-recreate \
               artwork-service-\$INACTIVE \
               api-gateway-\$INACTIVE

             # Wait for new gateway health
             HEALTHY=false

             for i in \$(seq 1 30); do
               if curl -fsS \
                 http://127.0.0.1:\$INACTIVE_PORT/actuator/health \
                 | grep -q '\"status\":\"UP\"'; then
                 HEALTHY=true
                 break
               fi

               echo \"Waiting for \$INACTIVE backend... attempt \$i/30\"
               sleep 5
             done

             if [ \"\$HEALTHY\" != \"true\" ]; then
               echo \"New backend failed health check\"

               docker compose -f docker-compose.blue-green.yml rm -sf \
                 artwork-service-\$INACTIVE \
                 api-gateway-\$INACTIVE

               exit 1
             fi

             echo \"New \$INACTIVE backend is healthy\"

             # Switch Nginx configuration to inactive slot
             sudo sed -i \
               \"s/server 127.0.0.1:[0-9]*;/server 127.0.0.1:\$INACTIVE_PORT;/\" \
               /etc/nginx/conf.d/neboltai-backend.conf

             # Validate Nginx before reload
             if ! sudo nginx -t; then
               echo \"Nginx configuration validation failed. Rolling back.\"

               sudo sed -i \
                 \"s/server 127.0.0.1:[0-9]*;/server 127.0.0.1:\$ACTIVE_PORT;/\" \
                 /etc/nginx/conf.d/neboltai-backend.conf

               exit 1
             fi

             sudo systemctl reload nginx

             # Verify new backend through Nginx
             if ! curl -fsS \
               'http://127.0.0.1/api/artworks/search?page=0&size=1' \
               > /dev/null; then

               echo \"Backend check through Nginx failed. Rolling back to \$ACTIVE.\"

               sudo sed -i \
                 \"s/server 127.0.0.1:[0-9]*;/server 127.0.0.1:\$ACTIVE_PORT;/\" \
                 /etc/nginx/conf.d/neboltai-backend.conf

               sudo nginx -t
               sudo systemctl reload nginx

               docker compose -f docker-compose.blue-green.yml rm -sf \
                 artwork-service-\$INACTIVE \
                 api-gateway-\$INACTIVE

               exit 1
             fi

             echo \"Traffic successfully switched from \$ACTIVE to \$INACTIVE\"

             # Stop and remove the old slot after successful switch
             docker compose -f docker-compose.blue-green.yml rm -sf \
               artwork-service-\$ACTIVE \
               api-gateway-\$ACTIVE

             echo \"Old \$ACTIVE slot removed\"
          
             docker image prune -f"